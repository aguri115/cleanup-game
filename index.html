<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>すっきり！お片付けプロトタイプ</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#f8f5ef;color:#4f4a43;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;touch-action:none}
  .app{max-width:520px;margin:auto;min-height:100vh;padding:18px 16px 28px}
  h1{font-size:24px;margin:4px 0 6px}
  .sub{font-size:13px;color:#777;margin-bottom:12px}
  .tasks{background:white;border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:0 2px 10px #0000000a}
  .tasks b{font-size:14px}.task{font-size:13px;margin-top:5px}.done{text-decoration:line-through;opacity:.45}
  #room{position:relative;height:650px;border-radius:28px;overflow:hidden;background:#d9c9ae;border:5px solid #eee5d7}
  .wall{position:absolute;left:0;right:0;top:0;height:45%;background:#eee7da}
  .floor{position:absolute;left:0;right:0;bottom:0;height:57%;background:#d9c9ae}
  .window{position:absolute;left:38px;top:42px;width:135px;height:170px;background:#cfe1e5;border:12px solid white;border-radius:18px}
  .rug{position:absolute;left:150px;bottom:48px;width:220px;height:150px;background:#eee7da;border-radius:30px}
  .shelf{position:absolute;right:28px;top:65px;width:125px;height:185px;background:#b99670;border-radius:16px}
  .shelf:after{content:"";position:absolute;left:12px;right:12px;top:48px;height:8px;background:#8e6f51;box-shadow:0 48px #8e6f51,0 96px #8e6f51}
  .item{position:absolute;z-index:5;user-select:none;touch-action:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;text-align:center;cursor:pointer}
  .trash{width:48px;height:48px;background:#c8b0a0;border-radius:14px}
  .book{width:55px;height:40px;background:#9eb7c2;border-radius:8px}
  .shirt{width:58px;height:48px;background:#d5a7a7;border-radius:12px}
  .box{width:90px;height:65px;background:#b9936e;border-radius:12px}
  .mug{width:48px;height:48px;background:#e4d4a9;border-radius:50%}
  .dirt{position:absolute;z-index:3;left:38px;bottom:85px;width:95px;height:65px;border-radius:50%;background:#a9957e;opacity:.85;touch-action:none}
  .dirt2{left:290px;bottom:220px;width:75px;height:50px}
  .target{position:absolute;z-index:2;border:2px dashed #9b8a73;border-radius:12px;color:#776a5b;font-size:11px;text-align:center;padding-top:12px;background:#ffffff40}
  #boxTarget{right:40px;bottom:285px;width:105px;height:78px}
  #bookTarget{right:45px;top:105px;width:90px;height:48px}
  #shirtTarget{right:45px;top:165px;width:90px;height:48px}
  .toast{position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:14px 18px;border-radius:18px;box-shadow:0 8px 30px #0002;font-weight:700;display:none}
  .hint{font-size:12px;color:#777;margin-top:10px;line-height:1.5}
  .clear{display:none;text-align:center;background:#fff;border-radius:20px;padding:18px;margin-top:12px;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <h1>すっきり！お片付け</h1>
  <div class="sub">まずは一部屋。好きな順番で、気持ちよく片付けよう。</div>

  <div class="tasks">
    <b>今回のお掃除　<span id="count">0 / 6</span></b>
    <div id="taskList">
      <div class="task" id="t1">□ ゴミを片付ける</div>
      <div class="task" id="t2">□ 本を本棚に戻す</div>
      <div class="task" id="t3">□ 服をクローゼットへ</div>
      <div class="task" id="t4">□ ダンボールを片付ける</div>
      <div class="task" id="t5">□ 床の汚れを掃除する</div>
      <div class="task" id="t6">□ テーブルの汚れを掃除する</div>
    </div>
  </div>

  <div id="room">
    <div class="wall"></div><div class="floor"></div>
    <div class="window"></div><div class="shelf"></div><div class="rug"></div>

    <div class="target" id="bookTarget">本棚</div>
    <div class="target" id="shirtTarget">クローゼット</div>
    <div class="target" id="boxTarget">収納スペース</div>

    <div class="item trash" id="trash" style="left:55px;top:285px">ゴミ</div>
    <div class="item book" id="book" style="left:175px;top:290px">本</div>
    <div class="item shirt" id="shirt" style="left:265px;top:335px">服</div>
    <div class="item box" id="box" style="left:70px;top:430px">ダンボール</div>
    <div class="dirt" id="dirt"></div>
    <div class="dirt dirt2" id="dirt2"></div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="hint">操作：タップ＝拾う・開ける　／　ドラッグ＝運ぶ　／　なぞる＝掃除</div>
  <div class="clear" id="clear">✨ すべて完了！ 次の場所へ進もう ✨</div>
</div>

<script>
const done = new Set();
const toast = document.getElementById('toast');
const count = document.getElementById('count');
function pop(msg){
  toast.textContent=msg; toast.style.display='block';
  clearTimeout(pop.t); pop.t=setTimeout(()=>toast.style.display='none',700);
}
function complete(id){
  if(done.has(id)) return;
  done.add(id);
  document.getElementById('t'+id.slice(1)).classList.add('done');
  count.textContent=`${done.size} / 6`;
  if(done.size===6) document.getElementById('clear').style.display='block';
}
function makeDraggable(el, target, taskId, successMsg){
  let dragging=false, ox=0, oy=0;
  const start=e=>{
    e.preventDefault();
    const p=e.touches?e.touches[0]:e;
    const r=el.getBoundingClientRect();
    ox=p.clientX-r.left; oy=p.clientY-r.top; dragging=true;
  };
  const move=e=>{
    if(!dragging)return;
    e.preventDefault();
    const p=e.touches?e.touches[0]:e;
    const rr=document.getElementById('room').getBoundingClientRect();
    el.style.left=(p.clientX-rr.left-ox)+'px';
    el.style.top=(p.clientY-rr.top-oy)+'px';
  };
  const end=e=>{
    if(!dragging)return; dragging=false;
    const a=el.getBoundingClientRect(), b=target.getBoundingClientRect();
    const hit=a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
    if(hit){
      el.style.left=(target.offsetLeft+target.offsetWidth/2-el.offsetWidth/2)+'px';
      el.style.top=(target.offsetTop+target.offsetHeight/2-el.offsetHeight/2)+'px';
      el.style.opacity=.25; el.style.pointerEvents='none';
      complete(taskId); pop(successMsg);
    }
  };
  el.addEventListener('pointerdown',start);
  window.addEventListener('pointermove',move,{passive:false});
  window.addEventListener('pointerup',end);
}
makeDraggable(book,document.getElementById('bookTarget'),'t2','本がスッと収まった！');
makeDraggable(shirt,document.getElementById('shirtTarget'),'t3','服を片付けた！');
makeDraggable(box,document.getElementById('boxTarget'),'t4','ダンボールを片付けた！');

trash.addEventListener('pointerdown',()=>{trash.style.display='none';complete('t1');pop('ゴミを片付けた！')});

box.addEventListener('dblclick',()=>{});

function setupDirt(el,taskId,msg){
  let progress=0,lastX=0,lastY=0,active=false;
  el.addEventListener('pointerdown',e=>{active=true;lastX=e.clientX;lastY=e.clientY;e.preventDefault()});
  el.addEventListener('pointermove',e=>{
    if(!active)return;
    const d=Math.hypot(e.clientX-lastX,e.clientY-lastY);
    if(d>8){progress+=d;lastX=e.clientX;lastY=e.clientY;
      const level=Math.min(1,progress/180);
      el.style.transform=`scale(${1-level*.3})`;
      el.style.opacity=String(.85-level*.8);
      if(progress>60&&progress<100) el.style.background='#c1b5a5';
      if(progress>=180){el.style.display='none';complete(taskId);pop(msg)}
    }
  },{passive:false});
  window.addEventListener('pointerup',()=>active=false);
}
setupDirt(document.getElementById('dirt'),'t5','床がピカピカ！');
setupDirt(document.getElementById('dirt2'),'t6','汚れが落ちた！');
</script>
</body>
</html>
